<!-- this sample is to demonstrate text styling using jQuery -->
 <!--This sample demonstrateds method chaining; manipulates content and styling of elements-->
<!DOCTYPE html>
<html>
<head>
    <title>jQuery Text Styling</title>
    <!-- Include jQuery library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> 
    <body>
    <h1>jQuery Text Styling Example</h1>
    <p>This is a sample paragraph to demonstrate text styling using jQuery.</p>
    <button id="changeBtn">Change Text</button>
    <script>
        $(function() {
            $('#changeBtn').click(function() {
                    // Change the text of the paragraph
                    $('p').text('The text has been changed using jQuery!');
                    // Change the color of the text
                    $('p').css('color', 'blue');
                    // Change the font size of the text
                    $('p').css('font-size', '20px');
            });
        });

    </script>
    </body>
</html>
