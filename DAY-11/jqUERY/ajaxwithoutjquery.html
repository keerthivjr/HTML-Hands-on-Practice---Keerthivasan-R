<!--This is a sample HTML file for jQuery AJAX operations without jQuery-->
<!DOCTYPE html>
<html>
<head>
    <title>AJAX without jQuery</title>
</head>
<body>
    <h1>AJAX Example without jQuery</h1>
    <button id="loadDataBtn">Load Data</button>
    <div id="result"></div>

    <script>
        document.getElementById('loadDataBtn').addEventListener('click', function() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://jsonplaceholder.typicode.com/posts/1', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    document.getElementById('result').innerHTML = '<h2>' + data.title + '</h2><p>' + data.body + '</p>';
                } else {
                    document.getElementById('result').innerHTML = '<p>An error occurred while loading data.</p>';
                }
            };
            xhr.send();
        });
    </script>
</html>
