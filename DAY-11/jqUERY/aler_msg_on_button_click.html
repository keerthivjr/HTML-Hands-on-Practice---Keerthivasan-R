<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jQuery Alert App</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>jQuery Alert Example</h1>

    <button id="alertBtn">Click Me</button>

    <script>
        $(document).ready(function() {

            $("#alertBtn").click(function() {
                alert("Hello Keerthivasan! 🚀 This is your jQuery alert message.");
            });

        });
    </script>

</body>
</html>
