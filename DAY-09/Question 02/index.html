<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-5">Featured Electronics</h1>

        <div class="row g-4">
            
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product Image">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="card-text text-muted mb-4">Noise-cancelling over-ear headphones.</p>
                        <h4 class="text-primary mb-3">$199.99</h4>
                        <div class="mt-auto d-grid gap-2">
                            <button class="btn btn-primary">Add to Cart</button>
                            <button class="btn btn-outline-secondary">View Details</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product Image">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="card-text text-muted mb-4">Fitness tracker with heart rate monitor.</p>
                        <h4 class="text-primary mb-3">$149.00</h4>
                        <div class="mt-auto d-grid gap-2">
                            <button class="btn btn-primary">Add to Cart</button>
                            <button class="btn btn-outline-secondary">View Details</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product Image">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">4K Action Camera</h5>
                        <p class="card-text text-muted mb-4">Waterproof camera for extreme sports.</p>
                        <h4 class="text-primary mb-3">$299.50</h4>
                        <div class="mt-auto d-grid gap-2">
                            <button class="btn btn-primary">Add to Cart</button>
                            <button class="btn btn-outline-secondary">View Details</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product Image">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Bluetooth Speaker</h5>
                        <p class="card-text text-muted mb-4">Portable speaker with 24-hour battery.</p>
                        <h4 class="text-primary mb-3">$59.99</h4>
                        <div class="mt-auto d-grid gap-2">
                            <button class="btn btn-primary">Add to Cart</button>
                            <button class="btn btn-outline-secondary">View Details</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
