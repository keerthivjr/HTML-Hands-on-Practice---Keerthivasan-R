<!DOCTYPE html>
<html>

<head>
    <title>Change Text Color</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script id="z0kw8m">
        $(document).ready(function () {

            $("#btn").click(function () {
                $("#text").css("color", "red");
            });

        });
    </script> 

</head>

<body>

    <p id="text">Hello World</p>

    <button id="btn">Change Color</button>

</body>

</html>
