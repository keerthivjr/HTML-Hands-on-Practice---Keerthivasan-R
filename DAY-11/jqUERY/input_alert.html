<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>jQuery Input Alert</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <h2>Enter Your Message</h2>

    <input type="text" id="userMsg" placeholder="Type something...">
    <button id="showMsg">Show Alert</button>

    <script>
        $(document).ready(function () {

            $("#showMsg").click(function () {

                var message = $("#userMsg").val();

                if (message.trim() === "") {
                    alert("Please enter a message!");
                } else {
                    alert(message);
                }

            });

        });
    </script>

</body>

</html>
